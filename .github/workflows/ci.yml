name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: tests/run.sh
      - name: Marketplace security baseline
        run: |
          git clone --depth 1 https://github.com/omacom/omarchy-plugin-marketplace.git "$RUNNER_TEMP/marketplace"
          node tests/marketplace-scan.mjs "$RUNNER_TEMP/marketplace"
